<style>
@import url('https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{--royal:#1565C0;--dunkel:#0D3E6A;--hellblau:#D6E8F7;--akzent:#42A5F5;
 --grau:#F5F8FB;--text:#2C2C2C;--dim:#6B7B8D;--bg:#f0f4f8;
 --kill:#E53935;--kill-bg:#FDECEA;--kill-tx:#C62828;--heal:#43A047}
html{-webkit-text-size-adjust:100%}
body{font-family:'Source Sans 3','DejaVu Sans',Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.master-header{background:linear-gradient(180deg,#3f63dd,#182f83);padding-top:env(safe-area-inset-top,0px)}
.header-content{display:flex;flex-direction:column;align-items:center;padding:18px 16px 14px;text-align:center}
.header-brand{display:flex;align-items:center;justify-content:center;gap:12px}
.header-logo{height:44px;width:44px;object-fit:contain;flex:none}
.header-title{font-size:23px;font-weight:700;color:#fff;letter-spacing:.3px}
.header-title span{color:var(--hellblau)}
.header-desc{font-size:13px;color:var(--hellblau);margin-top:4px}
.accent-line{height:3px;background:var(--akzent)}
.progress{background:#fff;border-bottom:1px solid #dbe6f0}
.progress-bar{height:5px;background:#e3ecf4}
.progress-fill{height:100%;background:var(--royal);transition:width .25s}
.progress-txt{max-width:560px;margin:0 auto;padding:8px 16px;font-size:13px;color:var(--dim);font-weight:600;display:flex;justify-content:space-between;gap:10px}
.progress-txt b{color:var(--dunkel)}
.container{max-width:560px;margin:0 auto;padding:16px}
.section{background:#fff;box-shadow:0 2px 8px rgba(13,62,106,.08);padding:16px;margin-bottom:14px;border-left:4px solid var(--royal);border-radius:12px;overflow:hidden}
.section-title{background:var(--royal);color:#fff;font-weight:700;font-size:13px;padding:7px 12px;margin:-16px -16px 14px -16px;letter-spacing:.4px;text-align:center}
h2.screen-title{font-size:22px;color:var(--dunkel);line-height:1.25;margin:4px 0 6px;overflow-wrap:anywhere}
.screen-sub{font-size:15px;color:var(--dim);margin-bottom:14px;line-height:1.5}
p.lead{font-size:16px;line-height:1.55;margin-bottom:10px}
.note{font-size:13.5px;color:var(--dim);line-height:1.5;background:var(--grau);border:1px solid #e3ecf4;border-radius:8px;padding:10px 12px}
label.fld{display:block;font-weight:700;font-size:14px;color:var(--dunkel);margin:12px 0 6px}
label.fld small{font-weight:500;color:var(--dim)}
.input,textarea.input{width:100%;padding:13px 14px;border:2px solid #d0dce8;border-radius:8px;font-size:16px;font-family:inherit;color:var(--text);background:#fff}
textarea.input{min-height:96px;resize:vertical;line-height:1.45}
.input:focus{outline:none;border-color:var(--royal);box-shadow:0 0 0 3px rgba(21,101,192,.12)}
.err{color:var(--kill-tx);font-size:13.5px;font-weight:600;margin-top:8px;display:none}
.err.show{display:block}
.q{font-weight:700;font-size:16px;color:var(--dunkel);margin-bottom:4px;line-height:1.35}
.q-hint{font-size:12.5px;color:var(--dim);margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:9px 14px;border:1.5px solid #cfdbe8;background:#fff;border-radius:10px;font-size:15px;font-family:inherit;color:var(--text);cursor:pointer;text-align:left;line-height:1.3;max-width:100%;overflow-wrap:anywhere}
.chip:focus-visible,.tile:focus-visible,.btn:focus-visible,.scale button:focus-visible{outline:3px solid var(--akzent);outline-offset:2px}
.chip.on{background:linear-gradient(135deg,var(--royal),#0d47a1);border-color:var(--royal);color:#fff;font-weight:600}
.blk-auff .chip.on{background:var(--kill);border-color:var(--kill)}
.blk-auff{border-left-color:var(--kill)}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.scale button{min-height:46px;border:1.5px solid #cfdbe8;background:#fff;border-radius:10px;font-size:17px;font-weight:700;font-family:'Source Code Pro',monospace;color:var(--dunkel);cursor:pointer}
.scale button.on{background:linear-gradient(135deg,var(--royal),#0d47a1);border-color:var(--royal);color:#fff}
.scale-ends{display:flex;justify-content:space-between;font-size:12.5px;color:var(--dim);margin-top:6px}
.search-wrap{position:relative}
.search-input{padding-left:42px}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--royal);pointer-events:none}
.sugg{margin-top:6px;border:1px solid #dbe6f0;border-radius:10px;overflow:hidden;background:#fff}
.sugg:empty{display:none}
.sugg button{display:block;width:100%;text-align:left;padding:12px 14px;border:none;border-top:1px solid #eef3f8;background:#fff;font-size:15px;font-family:inherit;color:var(--text);cursor:pointer}
.sugg button:first-child{border-top:none}
.sugg button small{color:var(--dim);font-size:12.5px}
.sugg button.free{background:var(--royal);color:#fff;font-weight:700;font-size:16px;padding:14px}
.picked{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.picked-item{display:flex;align-items:center;gap:10px;background:var(--hellblau);border:1px solid #b9d4ee;border-radius:10px;padding:8px 8px 8px 12px}
.picked-nr{flex:none;width:26px;height:26px;border-radius:50%;background:var(--royal);color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center}
.picked-name{flex:1;min-width:0;font-weight:700;color:var(--dunkel);overflow-wrap:anywhere}
.picked-x{flex:none;border:none;background:#fff;color:var(--kill-tx);border-radius:8px;width:40px;height:40px;font-size:20px;cursor:pointer}
.picked-empty{font-size:14px;color:var(--dim)}
.grouphead{font-size:15px;font-weight:700;color:var(--royal);margin:16px 0 8px;padding-bottom:4px;border-bottom:1px solid #e3ecf4}
.grouphead:first-child{margin-top:0}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tile{position:relative;background:#fff;border:1px solid #dbe6f0;border-radius:10px;padding:12px 12px 12px 15px;cursor:pointer;text-align:left;font-family:inherit;font-weight:700;font-size:15px;color:var(--text);min-height:48px;overflow-wrap:break-word;-webkit-hyphens:auto;hyphens:auto}
.tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--royal);opacity:.35;border-radius:10px 0 0 10px}
.tile.on{background:linear-gradient(135deg,var(--royal),#0d47a1);border-color:var(--royal);color:#fff}
.tile.on::before{opacity:0}
.ov-thema{margin-bottom:14px}
.ov-row{padding:8px 0;border-top:1px solid #eef3f8}
.ov-row:first-of-type{border-top:none}
.ov-q{font-size:12.5px;font-weight:700;color:var(--dim)}
.ov-a{font-size:15px;line-height:1.45;overflow-wrap:anywhere;white-space:pre-wrap}
.ov-row.auff .ov-a{color:var(--kill-tx);font-weight:700}
.ov-empty{font-size:14px;color:var(--dim);font-style:italic}
.ov-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.ov-head h3{font-size:17px;color:var(--dunkel);overflow-wrap:anywhere;min-width:0}
.btn{min-height:48px;border-radius:10px;padding:12px 18px;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer;border:none}
.btn-pri{background:var(--royal);color:#fff}
.btn-pri:disabled{background:#9fb6cf;cursor:default}
.btn-sec{background:#fff;color:var(--royal);border:1.5px solid var(--royal)}
.btn-edit{min-height:40px;padding:8px 14px;font-size:14px;flex:none}
.btn-big{width:100%;font-size:17px;min-height:56px}
.btn-reset{background:none;border:none;color:var(--kill-tx);font-size:14px;font-weight:600;font-family:inherit;text-decoration:underline;cursor:pointer;padding:10px 4px}
.navbar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #d0dce8;box-shadow:0 -2px 10px rgba(13,62,106,.08);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));z-index:10}
.navbar-in{max-width:560px;margin:0 auto;display:flex;gap:10px}
.navbar .btn{flex:1}
.navbar .btn-sec{flex:0 0 auto;min-width:96px}
.status{margin-top:12px;font-size:15px;line-height:1.5}
.status .ok{color:#2E7D32;font-weight:700}
.fallback{margin-top:12px;background:#FFF6E0;border-left:5px solid #E8A317;border-radius:8px;padding:12px 14px;font-size:15px;line-height:1.55;color:#5c4100}
.fallback a{color:var(--royal);font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--dunkel);color:#fff;padding:10px 16px;border-radius:10px;font-size:14.5px;max-width:calc(100% - 32px);text-align:center;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.codebox{font-family:'Source Code Pro',monospace;font-size:12.5px;word-break:break-all;background:var(--grau);border:1px solid #d0dce8;border-radius:8px;padding:10px 12px;max-height:160px;overflow:auto;color:var(--dunkel);user-select:all;-webkit-user-select:all}
.footer{text-align:center;padding:10px 16px 20px;font-size:11.5px;color:var(--dim);line-height:1.6}
@media (max-width:420px){.header-title{font-size:20px}.header-logo{height:38px;width:38px}.header-desc{font-size:12px}}
@media (prefers-reduced-motion:reduce){.progress-fill,.toast{transition:none}}
</style>
</head>

const $ = id => document.getElementById(id);
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function norm(s) { return String(s || '').toLowerCase().trim().replace(/\s+/g, ' '); }
function fold(s) { return norm(s).replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss'); }

const SPEZIAL = ['tin', 'sch', 'zit'];
function katalogFuer(titel) {
  const f = fold(titel); if (!f) return 'uni';
  let best = null, bs = 0;
  const pruefe = (kid, w, bonus) => {
    w = fold(w); if (w.length < 3) return;
    let p = 0;
    if (w === f) p = 1000 + w.length;
    else if (w.length >= 4 && f.includes(w)) p = 100 + w.length;
    else if (f.length >= 4 && w.startsWith(f)) p = 50 + f.length;
    if (p && p + bonus > bs) { bs = p + bonus; best = kid; }
  };
  for (const k of Object.values(KATALOGE)) {
    if (k.id === 'uni') continue;
    pruefe(k.id, k.titel, 1); k.suchbegriffe.forEach(b => pruefe(k.id, b, 1));
  }
  for (const kid of Object.keys(FINDER_WORT)) FINDER_WORT[kid].split('|').forEach(w => pruefe(kid, w, 0));
  return best || 'uni';
}
function blockVon(kat, bid) { return KATALOGE[kat].bloecke.find(b => b.id === bid); }
function antwortText(kat, bid, aid) { const b = blockVon(kat, bid); const a = b && b.antworten ? b.antworten.find(x => x.id === aid) : null; return a ? a.text : aid; }

function felderUebernehmen() {

    let alt = S.themen.find(passt);
    if (!alt && S.ablage) { const k = Object.keys(S.ablage).find(k => passt(S.ablage[k])); if (k) { alt = S.ablage[k]; delete S.ablage[k]; } }

function vorschlaege(q) {
  const f = fold(q);
  if (f.length < 2) return [];
  const pool = [];
  for (const g of THEMEN) for (const t of g.themen) pool.push({ titel: t, hinweis: g.gruppe });
  for (const k of Object.values(KATALOGE)) {
    if (k.id === 'uni') continue;
    for (const b of k.suchbegriffe) pool.push(SPEZIAL.includes(k.id) ? { titel: k.titel, treffer: b } : { titel: b, hinweis: k.titel });
  }
  const out = [], seen = new Set();
  const push = (x) => { if (!seen.has(fold(x.titel))) { seen.add(fold(x.titel)); out.push(x); } };
  pool.filter(x => fold(x.titel).startsWith(f) || (x.treffer && fold(x.treffer).startsWith(f))).forEach(push);
  pool.filter(x => fold(x.titel).includes(f) || (x.treffer && fold(x.treffer).includes(f))).forEach(push);
  return out.slice(0, 6);
}
function teile(text) { return String(text || '').split(/\s*[,;+\n]\s*/).map(x => x.trim()).filter(x => x.length >= 2); }
function besterTitel(p) { const v = vorschlaege(p); return v.length && fold(v[0].titel) === fold(p) ? v[0].titel : p; }

function themaDazu(titel) {

function rBlock(i, t, b) {

function waehle(i, bid, aid) {
  const t = S.themen[i]; if (!t) return;
  const b = blockVon(t.kat, bid); if (!b) return;
  if (b.typ === 'einfach') {
    if (t.a[bid] === aid) delete t.a[bid]; else t.a[bid] = aid;
  } else {
    let arr = Array.isArray(t.a[bid]) ? t.a[bid].slice() : [];
    const ant = b.antworten.find(x => x.id === aid);
    if (arr.includes(aid)) arr = arr.filter(x => x !== aid);
    else if (ant && ant.exklusiv) arr = [aid];
    else { const ex = b.antworten.filter(x => x.exklusiv).map(x => x.id); arr = arr.filter(x => !ex.includes(x)); arr.push(aid); }
    if (arr.length) t.a[bid] = b.antworten.filter(x => arr.includes(x.id)).map(x => x.id); else delete t.a[bid];
  }
  speichern(); blockNeu(i, bid);

/* Liefert pro Thema die beantworteten Blöcke als lesbaren Text (für Übersicht und PDF). */
function auswertung(t) {
  const k = KATALOGE[t.kat]; const rows = [];
  for (const b of k.bloecke) {
    const w = t.a[b.id];
    if (w == null || w === '' || (Array.isArray(w) && !w.length)) continue;
    let text = '', auff = false;
    if (b.typ === 'skala') text = w + ' von 10';
    else if (b.typ === 'text') { text = String(w).trim(); if (!text) continue; }
    else {
      const ids = Array.isArray(w) ? w : [w];
      text = ids.map(id => antwortText(t.kat, b.id, id)).join(', ');
      if (b.auffaellig) auff = ids.some(id => { const a = b.antworten.find(x => x.id === id); return a && !a.exklusiv; });
    }
    rows.push({ frage: b.frage, text: text, auff: auff, typ: b.typ });
  }
  return rows;
}

/* Nachricht als Text: gut lesbar, Auffälliges zuoberst, Auswerte-Code am Schluss (Finder liest die ganze Nachricht). */
function nachricht() {
  const k = S.kopf, L = [];
  L.push('Fragebogen');
  L.push('Name: ' + k.name.trim());
  if (k.jahr.trim()) L.push('Geburtsjahr: ' + k.jahr.trim());
  if (k.tel.trim()) L.push('Handy: ' + k.tel.trim());
  L.push('Datum: ' + chHeute());
  const auff = [];
  S.themen.forEach(t => auswertung(t).forEach(r => { if (r.auff) auff.push(t.titel + ': ' + r.text); }));
  if (auff.length) { L.push(''); L.push('!! AUFFÄLLIG: ' + auff.join(' / ')); }
  S.themen.forEach((t, i) => {
    L.push(''); L.push((i + 1) + ') ' + t.titel.toUpperCase());
    const rows = auswertung(t);
    if (!rows.length) L.push('- keine Angaben');
    rows.forEach(r => L.push('- ' + r.frage + ' ' + r.text.replace(/\s*\n\s*/g, ' ')));
  });
  if (S.allgemein.trim()) { L.push(''); L.push('SONST NOCH WICHTIG'); L.push(S.allgemein.trim()); }
  L.push('');
  if (APP_URL) { L.push('Auswerte-Code: antippen, dann «Code kopieren»'); L.push(APP_URL + '#code=' + fbCode()); }
  else { L.push('Auswerte-Code (für den Finder):'); L.push(fbCode()); }
  return L.join('\n');
}

function kopfOk() {

  else if (k.jahr && !/^(19|20)\d\d$/.test(k.jahr.trim())) msg = 'Bitte das Geburtsjahr vierstellig eingeben, z. B. 1964.';
  if (e) { e.textContent = msg; e.classList.toggle('show', !!msg); }
  return !msg;
}
function weiter() {
  if (S.schritt === 'start' && !kopfOk()) return;
  if (S.schritt === 'themen') {
    if (!felderUebernehmen()) return;
    if (!S.themen.length) { toast('Bitte schreiben Sie mindestens ein Thema in ein Feld.'); const f = document.querySelector('[data-feld="0"]'); if (f) f.focus(); return; }
  }

    if (S.schritt === 'themen') { S.zurUebersicht = false; gehe('t0'); return; }
    gehe('check'); return;
  }
  const l = schritte(); const i = l.indexOf(S.schritt);
  if (S.schritt === 'check') S.zurUebersicht = false;
  if (i < l.length - 1) gehe(l[i + 1]);
}

  if (S.zurUebersicht && S.schritt !== 'check') { gehe('check'); return; }
  const l = schritte(); const i = l.indexOf(S.schritt);

}

/* ---------- PDF ---------- */
function latin(s) {
  return String(s == null ? '' : s).replace(/[\uD800-\uDFFF\uFE0F\u200D]/g, '').replace(/[\u2013\u2014]/g, '-').replace(/[\u201E\u201C\u201D]/g, '"').replace(/[\u201A\u2018\u2019]/g, "'")
    .replace(/\u2026/g, '...').replace(/\u00A0/g, ' ').replace(/\r\n?/g, '\n').replace(/[^\n\x20-\x7E\u00A0-\u00FF]/g, '?');
}
function dateiName(heute) {
  const n = S.kopf.name.trim().replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/Ä/g, 'Ae').replace(/Ö/g, 'Oe').replace(/Ü/g, 'Ue').replace(/ß/g, 'ss')
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^A-Za-z0-9 -]/g, '').trim().split(/\s+/).join('_') || 'Kunde';
  return 'Fragebogen_' + n + '_' + heute + '.pdf';
}
function isoHeute() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function chHeute() { const d = new Date(); return String(d.getDate()).padStart(2, '0') + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.' + d.getFullYear(); }

function baueTitelBand(doc, W) {
  const H = 30, a = [63, 99, 221], z = [24, 47, 131], n = 40;
  for (let s = 0; s < n; s++) {
    const f = s / (n - 1);
    doc.setFillColor(Math.round(a[0] + (z[0] - a[0]) * f), Math.round(a[1] + (z[1] - a[1]) * f), Math.round(a[2] + (z[2] - a[2]) * f));
    doc.rect(0, H * s / n, W, H / n + 0.3, 'F');
  }
  doc.setFillColor(66, 165, 245); doc.rect(0, H, W, 1.2, 'F');
  try { const logo = document.querySelector('.header-logo').src; doc.addImage(logo, 'PNG', 14, 6, 18, 18); } catch (e) { }
  doc.setTextColor(255, 255, 255); doc.setFont('helvetica', 'bold'); doc.setFontSize(19);
  doc.text('Fragebogen', 37, 14.5);
  doc.setTextColor(214, 232, 247); doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5);
  doc.text(latin('Bioenergetische Frequenzarbeit · Markus Rufer, Meiringen'), 37, 21);
  doc.setFontSize(10); doc.setTextColor(255, 255, 255);
  doc.text(chHeute(), W - 14, 14.5, { align: 'right' });
  return H + 1.2;
}

function erstellePDF() {
  if (!window.jspdf || !window.jspdf.jsPDF) throw new Error('PDF-Bibliothek nicht geladen');
  const doc = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4' });
  /* Auswerte-Code unsichtbar in den PDF-Eigenschaften: der Finder liest ihn direkt aus der Datei. */
  doc.setProperties({ title: 'Fragebogen', subject: 'Fragebogen', author: latin(S.kopf.name.trim()), keywords: fbCode(), creator: 'Fragebogen-App' });
  const W = 210, Hs = 297, M = 14, IW = W - 2 * M, FUSS = 16;
  let y = baueTitelBand(doc, W) + 8;
  const neueSeite = () => { doc.addPage(); doc.setFillColor(21, 101, 192); doc.rect(0, 0, W, 3, 'F'); y = 14; };
  const platz = h => { if (y + h > Hs - FUSS) neueSeite(); };
  const zeilen = (txt, breite, gr, stil) => { doc.setFont('helvetica', stil || 'normal'); doc.setFontSize(gr); return doc.splitTextToSize(latin(txt), breite); };
  const LH = 4.9;

  /* Kopfdaten */
  const k = S.kopf;
  const kd = [['Kunde', k.name.trim()], ['Geburtsjahr', k.jahr.trim() || '-'], ['Handynummer', k.tel.trim() || '-'], ['Ausgefüllt am', chHeute()]];
  const kh = 7 + kd.length * 6.2 + 2;
  doc.setFillColor(245, 248, 251); doc.setDrawColor(208, 220, 232); doc.roundedRect(M, y, IW, kh, 2, 2, 'FD');
  doc.setFillColor(21, 101, 192); doc.rect(M, y, 1.6, kh, 'F');
  let yy = y + 7;
  for (const [l, v] of kd) {
    doc.setFont('helvetica', 'bold'); doc.setFontSize(10); doc.setTextColor(107, 123, 141); doc.text(latin(l), M + 6, yy);
    doc.setFont('helvetica', l === 'Kunde' ? 'bold' : 'normal'); doc.setFontSize(l === 'Kunde' ? 12 : 11); doc.setTextColor(44, 44, 44);
    doc.text(zeilen(v, IW - 50, l === 'Kunde' ? 12 : 11, l === 'Kunde' ? 'bold' : 'normal')[0] || '', M + 44, yy);
    yy += 6.2;
  }
  y += kh + 6;

  /* Auffälliges zuoberst zusammenfassen */
  const auffListe = [];
  S.themen.forEach(t => auswertung(t).forEach(r => { if (r.auff) auffListe.push(t.titel + ': ' + r.text); }));
  if (auffListe.length) {
    const lines = [];
    auffListe.forEach(s => zeilen(s, IW - 12, 11, 'bold').forEach(l => lines.push(l)));
    const h = 9 + lines.length * LH + 3;
    platz(h);
    doc.setFillColor(253, 236, 234); doc.setDrawColor(229, 57, 53); doc.setLineWidth(0.5); doc.roundedRect(M, y, IW, h, 2, 2, 'FD');
    doc.setFillColor(229, 57, 53); doc.rect(M, y, 2.2, h, 'F');
    doc.setFont('helvetica', 'bold'); doc.setFontSize(10.5); doc.setTextColor(198, 40, 40);
    doc.text(latin('ACHTUNG – AUFFÄLLIGE ANGABEN'), M + 6, y + 6.5);
    doc.setFontSize(11); let ly = y + 12;
    lines.forEach(l => { doc.text(l, M + 6, ly); ly += LH; });
    y += h + 6; doc.setLineWidth(0.2);
  }

  /* Themen */
  const LW = 52, VX = M + LW + 4, VW = IW - LW - 6;
  S.themen.forEach((t, i) => {
    platz(24);
    doc.setFillColor(21, 101, 192); doc.roundedRect(M, y, IW, 9, 1.5, 1.5, 'F');
    doc.setFont('helvetica', 'bold'); doc.setFontSize(12.5); doc.setTextColor(255, 255, 255);
    doc.text(latin('Thema ' + (i + 1) + ': ' + t.titel), M + 4, y + 6.2);
    const kt = t.kat === 'uni' ? 'allgemeiner Fragebogen' : (fold(KATALOGE[t.kat].titel) !== fold(t.titel) ? KATALOGE[t.kat].titel : '');
    if (kt) { doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.setTextColor(214, 232, 247); doc.text(latin(kt), M + IW - 4, y + 6.2, { align: 'right' }); }
    y += 12;
    const rows = auswertung(t);
    if (!rows.length) { doc.setFont('helvetica', 'italic'); doc.setFontSize(10.5); doc.setTextColor(107, 123, 141); doc.text('Keine Angaben.', M + 3, y + 3); y += 9; return; }
    rows.forEach((r, ri) => {
      if (r.typ === 'text') {
        platz(12);
        doc.setFont('helvetica', 'bold'); doc.setFontSize(9.5); doc.setTextColor(107, 123, 141);
        zeilen(r.frage, IW - 6, 9.5, 'bold').forEach(l => { doc.text(l, M + 3, y + 3.3); y += 4.3; });
        y += 1.5;
        zeilen(r.text, IW - 10, 11, 'normal').forEach(l => { platz(LH); doc.setFont('helvetica', 'normal'); doc.setFontSize(11); doc.setTextColor(44, 44, 44); doc.text(l, M + 6, y + 3.6); y += LH; });
        y += 3; return;
      }
      const lq = zeilen(r.frage, LW, 9.5, 'bold');
      const lv = zeilen(r.text, VW, r.typ === 'skala' ? 12 : 11, (r.auff || r.typ === 'skala') ? 'bold' : 'normal');
      const h = Math.max(lq.length * 4.3, lv.length * LH) + 3.4;
      platz(h + 1);
      if (r.auff) { doc.setFillColor(253, 236, 234); doc.setDrawColor(229, 57, 53); doc.setLineWidth(0.4); doc.rect(M, y - 1, IW, h, 'FD'); doc.setLineWidth(0.2); }
      else if (ri % 2 === 1) { doc.setFillColor(245, 248, 251); doc.rect(M, y - 1, IW, h, 'F'); }
      doc.setFont('helvetica', 'bold'); doc.setFontSize(9.5); doc.setTextColor(r.auff ? 198 : 107, r.auff ? 40 : 123, r.auff ? 40 : 141);
      lq.forEach((l, n) => doc.text(l, M + 3, y + 3.3 + n * 4.3));
      doc.setFont('helvetica', (r.auff || r.typ === 'skala') ? 'bold' : 'normal'); doc.setFontSize(r.typ === 'skala' ? 12 : 11);
      if (r.auff) doc.setTextColor(198, 40, 40); else if (r.typ === 'skala') doc.setTextColor(13, 62, 106); else doc.setTextColor(44, 44, 44);
      lv.forEach((l, n) => doc.text(l, VX, y + 3.6 + n * LH));
      y += h;
    });
    y += 6;
  });

  /* Allgemeines */
  const allg = S.allgemein.trim();
  platz(20);
  doc.setFillColor(13, 62, 106); doc.roundedRect(M, y, IW, 9, 1.5, 1.5, 'F');
  doc.setFont('helvetica', 'bold'); doc.setFontSize(12.5); doc.setTextColor(255, 255, 255);
  doc.text('Was sonst noch wichtig ist', M + 4, y + 6.2); y += 13;
  if (allg) {
    const ls = zeilen(allg, IW - 6, 11, 'normal'); doc.setTextColor(44, 44, 44);
    ls.forEach(l => { platz(LH); doc.setFont('helvetica', 'normal'); doc.setFontSize(11); doc.setTextColor(44, 44, 44); doc.text(l, M + 3, y); y += LH; });
  } else { doc.setFont('helvetica', 'italic'); doc.setFontSize(10.5); doc.setTextColor(107, 123, 141); doc.text('Keine Angabe.', M + 3, y); }

  /* Fusszeile */
  const n = doc.getNumberOfPages();
  for (let p = 1; p <= n; p++) {
    doc.setPage(p);
    doc.setDrawColor(208, 220, 232); doc.setLineWidth(0.3); doc.line(M, Hs - 12, W - M, Hs - 12);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.setTextColor(107, 123, 141);
    doc.text(latin('Fragebogen · ' + k.name.trim()), M, Hs - 8);
    doc.text('Seite ' + p + ' von ' + n, W - M, Hs - 8, { align: 'right' });
    doc.setFontSize(7.5);
    doc.text(latin('Bioenergetische Frequenzarbeit · Markus Rufer · Brünigstrasse 33, 3860 Meiringen · 078 943 38 60'), M, Hs - 4);
  }
  return { doc: doc, name: dateiName(isoHeute()) };
}

/* ---------- Antwort-Code FB1 (gleiches Format wie im Finder) ---------- */
const CRC_T = (function () { const t = []; for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1); t[n] = c >>> 0; } return t; })();
function crc32(str) { let c = 0xFFFFFFFF; for (let i = 0; i < str.length; i++) c = CRC_T[(c ^ str.charCodeAt(i)) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function pruef(b) { let z = (crc32(b) % 1679616).toString(36); while (z.length < 4) z = '0' + z; return z; }
function utf8b64url(s) { const bytes = new TextEncoder().encode(s); let bin = ''; for (let j = 0; j < bytes.length; j++) bin += String.fromCharCode(bytes[j]); return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
function fbDaten() {
  const d = { n: S.kopf.name.trim(), j: S.kopf.jahr.trim(), t: S.kopf.tel.trim(), d: isoHeute(), th: [], m: {}, vg: {} };
  const frei = [];
  const setz = (mod, k, c) => {
    const ziel = mod === 'vg' ? d.vg : (d.m[mod] = d.m[mod] || {});
    if (FB_EINS[mod + '.' + k]) { if (ziel[k] === undefined) ziel[k] = c; return; }
    ziel[k] = ziel[k] || []; if (!ziel[k].includes(c)) ziel[k].push(c);
  };
  S.themen.forEach(t => {
    const mod = FB_MODUL[t.kat];
    if (mod) d.th.push(mod); else { d.th.push(t.titel); frei.push(t.titel); }
    const k = KATALOGE[t.kat];
    k.bloecke.forEach(b => {
      const w = t.a[b.id]; if (w == null || w === '') return;
      if (b.typ === 'text') { const x = String(w).trim(); if (x) frei.push(x); return; }
      if (!mod) return;
      if (b.typ === 'skala') { d.m[mod] = d.m[mod] || {}; d.m[mod].bel = w; return; }
      [].concat(w).forEach(id => {
        if (/\.seit\./.test(id)) { const c = FB_SEIT[id.split('.').pop()]; if (c) setz(mod, 'seit', c); return; }
        const z = FB_BRUECKE[id]; if (z) setz(z[0] === 'vg' ? 'vg' : mod, z[1], z[2]);
      });
    });
    if (mod === 'schw' && (!d.m.schw || !d.m.schw.dauer) && (t.a['sch.wann'] || []).includes('sch.wann.dauernd')) setz('schw', 'dauer', 'dau');
  });
  /* Alle Antworten im neuen Format: [Katalog, Thema, [Antwort-IDs, Skala als «block=Wert»]] — Auswerter ab Finder v245 */
  d.x = S.themen.map(t => {
    const L = [];
    KATALOGE[t.kat].bloecke.forEach(b => { const w = t.a[b.id]; if (w == null || w === '') return;
      if (b.typ === 'skala') L.push(b.id + '=' + w); else if (b.typ !== 'text') [].concat(w).forEach(id => L.push(id)); });
    return [t.kat, t.titel, L];
  });
  d.tp = d.th.slice();
  if (S.allgemein.trim()) frei.push(S.allgemein.trim());
  if (frei.length) d.f = frei.join('. ');
  if (!Object.keys(d.vg).length) delete d.vg;
  return d;
}
function fbCode() { const b = utf8b64url(JSON.stringify(fbDaten())); return 'FB1-' + b + '-' + pruef(b); }

async function senden() {
  const st = $('send-status'), btn = $('send-btn');
  st.innerHTML = '';
  let pdf;
  try { pdf = erstellePDF(); }
  catch (e) { st.innerHTML = '<div class="fallback">Das PDF konnte nicht erstellt werden. Bitte prüfen Sie die Internetverbindung und versuchen Sie es nochmals.</div>'; return; }
  const blob = pdf.doc.output('blob');
  let file = null;
  try { file = new File([blob], pdf.name, { type: 'application/pdf' }); } catch (e) { }
  if (file && navigator.canShare && navigator.share) {
    let kann = false;
    try { kann = navigator.canShare({ files: [file] }); } catch (e) { }
    if (kann) {
      btn.disabled = true;
      try {
        await navigator.share({ files: [file], title: 'Fragebogen', text: 'Mein Fragebogen (' + S.kopf.name.trim() + ') für Markus Rufer' });
        st.innerHTML = '<span class="ok">Danke. Das PDF wurde übergeben.</span><br>Falls Sie WhatsApp nicht gewählt haben, tippen Sie nochmals auf den Knopf.';
        btn.textContent = 'Nochmals senden';
        return;
      } catch (e) {
        if (e && e.name === 'AbortError') { st.textContent = 'Senden abgebrochen. Tippen Sie nochmals auf den Knopf, wenn Sie bereit sind.'; return; }
      } finally { btn.disabled = false; }
    }
  }
  /* Rückfall: herunterladen und von Hand senden */
  try {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = pdf.name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  } catch (e) { }
  st.innerHTML = '<div class="fallback"><b>PDF in WhatsApp an Markus senden.</b><br>Das PDF «' + esc(pdf.name) + '» wurde auf Ihrem Gerät gespeichert. Öffnen Sie den Chat mit Markus und hängen Sie es über die Büroklammer an.<br><br>' +
    '<a href="https://wa.me/' + MARKUS_WA + '" target="_blank" rel="noopener">WhatsApp-Chat mit Markus öffnen</a><br>' +
    '<a href="tel:' + MARKUS_TEL + '">078 943 38 60</a></div>';
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act;
  if (act === 'tile') {
    const idx = S.themen.findIndex(t => fold(t.titel) === fold(el.dataset.t));
    if (idx >= 0) themaWeg(idx); else themaDazu(el.dataset.t);
  }
  else if (act === 'add') themenDazu(el.dataset.t);
  else if (act === 'del') themaWeg(+el.dataset.i);
  else if (act === 'ans') waehle(+el.dataset.i, el.dataset.b, el.dataset.a);
  else if (act === 'skala') {
    const t = S.themen[+el.dataset.i]; const n = +el.dataset.n;
    if (t.a[el.dataset.b] === n) delete t.a[el.dataset.b]; else t.a[el.dataset.b] = n;
    speichern(); blockNeu(+el.dataset.i, el.dataset.b);
  }
  else if (act === 'edit') { S.zurUebersicht = true; gehe(el.dataset.s); }
  else if (act === 'send') senden();
  else if (act === 'wa') location.href = waLink();
  else if (act === 'sms') location.href = smsLink();
  else if (act === 'dl') nurSpeichern();
  else if (act === 'reset') neuBeginnen();
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset && el.dataset.kopf) { S.kopf[el.dataset.kopf] = el.value; speichern(); }
  else if (el.dataset && el.dataset.feld !== undefined) { felderInit(); S.felder[+el.dataset.feld] = el.value; speichern(); }
  else if (el.dataset && el.dataset.act === 'txt') { const t = S.themen[+el.dataset.i]; if (el.value.trim()) t.a[el.dataset.b] = el.value; else delete t.a[el.dataset.b]; speichern(); }
  else if (el.dataset && el.dataset.act === 'allg') { S.allgemein = el.value; speichern(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.feld !== undefined) { e.preventDefault();
    const n = document.querySelector('[data-feld="' + (+e.target.dataset.feld + 1) + '"]'); if (n) n.focus(); else weiter(); }
});
$('nav-next').addEventListener('click', weiter);
$('nav-back').addEventListener('click', zurueck);

/* Kopier-Ansicht für Markus: Link aus der WhatsApp-Nachricht öffnet nur den Code, der Zwischenstand bleibt unberührt. */
function codeAusLink() { const m = /^#code=(FB1-[A-Za-z0-9_-]+-[0-9a-z]{4})$/.exec(location.hash); return m ? m[1] : ''; }
async function kopiere(txt) {
  try { await navigator.clipboard.writeText(txt); return true; } catch (e) { }
  try { const ta = document.createElement('textarea'); ta.value = txt; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, txt.length); const ok = document.execCommand('copy'); ta.remove(); return ok; } catch (e) { return false; }
}
function codeAnsicht(code) {
  document.querySelector('.progress').style.display = 'none';
  document.querySelector('.navbar').style.display = 'none';
  document.body.style.paddingBottom = '0';
  $('screen').innerHTML = '<h2 class="screen-title">Auswerte-Code</h2><p class="screen-sub">Für den Frequenz-Finder.</p>' +
    '<div class="section"><div class="section-title">CODE</div>' +
    '<button type="button" class="btn btn-pri btn-big" id="code-kopieren">Code kopieren</button>' +
    '<div class="codebox" style="margin-top:12px">' + esc(code) + '</div></div>';
  $('code-kopieren').addEventListener('click', async () => {
    const ok = await kopiere(code);
    toast(ok ? 'Code kopiert. Jetzt im Finder einfügen.' : 'Kopieren nicht möglich. Code antippen und kopieren.');
    if (ok) $('code-kopieren').textContent = 'Kopiert ✓';
  });
}

const LINKCODE = codeAusLink();
if (LINKCODE) codeAnsicht(LINKCODE);
else { laden(); render(); }
